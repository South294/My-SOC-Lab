# Docker Compose for Wazuh SIEM All-In-One / Single-Node Lab
# Phù hợp thực hành SOC Analyst Tier 1 - Bật tắt nhanh, không cấu hình rườm rà.
# Cách dùng:
#   docker compose up -d
#   Truy cập Web Dashboard: https://localhost:443 (hoặc IP máy chủ)
#   User mặc định: admin / Password: SecretPassword123!

version: '3.8'

services:
  wazuh.manager:
    image: wazuh/wazuh-manager:4.7.2
    hostname: wazuh.manager
    restart: always
    ports:
      - "1514:1514"       # Nhận log từ Wazuh Agent
      - "1515:1515"       # Đăng ký Agent tự động (Enrollment)
      - "514:514/udp"     # Nhận Syslog từ Router/Firewall
      - "55000:55000"     # Wazuh API
    environment:
      - INDEXER_URL=https://wazuh.indexer:9200
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=SecretPassword123!
    volumes:
      - ./wazuh_data/wazuh_logs:/var/ossec/logs
      - ../configurations/siem-rules/local_rules.xml:/var/ossec/etc/rules/local_rules.xml:ro
    networks:
      - soc-lab-net

  wazuh.indexer:
    image: wazuh/wazuh-indexer:4.7.2
    hostname: wazuh.indexer
    restart: always
    ports:
      - "9200:9200"
    environment:
      - "OPENSEARCH_INITIAL_ADMIN_PASSWORD=SecretPassword123!"
    volumes:
      - ./wazuh_data/wazuh_indexer_data:/var/lib/wazuh-indexer
    networks:
      - soc-lab-net

  wazuh.dashboard:
    image: wazuh/wazuh-dashboard:4.7.2
    hostname: wazuh.dashboard
    restart: always
    ports:
      - "443:5601"        # Mở Dashboard trực ca SOC trên cổng 443
    environment:
      - INDEXER_URL=https://wazuh.indexer:9200
      - WAZUH_API_URL=https://wazuh.manager:55000
    depends_on:
      - wazuh.indexer
      - wazuh.manager
    networks:
      - soc-lab-net

networks:
  soc-lab-net:
    driver: bridge

<!-- 
  Wazuh Agent Configuration for Linux Web Target (Ubuntu/Debian)
  Role: Web Server with Nginx + ModSecurity WAF + Suricata NIDS
  Purpose: Collect authentication, web server, WAF, and network IDS logs to send to Wazuh Manager.
-->
<ossec_config>
  <client>
    <server>
      <!-- Change this to your Wazuh Manager IP -->
      <address>192.168.1.100</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <config-profile>ubuntu, linux</config-profile>
  </client>

  <!-- 1. OS & SSH Authentication Logs (detect SSH brute force) -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>
  </localfile>

  <!-- 2. System Syslog -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/syslog</location>
  </localfile>

  <!-- 3. Nginx Access Logs (HTTP traffic analysis) -->
  <localfile>
    <log_format>apache</log_format>
    <location>/var/log/nginx/access.log</location>
  </localfile>

  <!-- 4. Nginx Error Logs -->
  <localfile>
    <log_format>apache</log_format>
    <location>/var/log/nginx/error.log</location>
  </localfile>

  <!-- 5. ModSecurity WAF Audit Log (OWASP Top 10 web attack alerts) -->
  <localfile>
    <log_format>apache</log_format>
    <location>/var/log/modsecurity/modsec_audit.log</location>
  </localfile>

  <!-- 6. Suricata NIDS JSON Log (Network signatures & anomaly detection) -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/suricata/eve.json</location>
  </localfile>
</ossec_config>


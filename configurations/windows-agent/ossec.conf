<!--
  Wazuh Agent Configuration for Windows Endpoint
  Role: Workstation Monitoring (Windows 10/11 or Server)
  Purpose: Collect Windows Security Event Logs and Sysmon Operational logs
-->
<ossec_config>
  <client>
    <server>
      <!-- Replace with your Wazuh Manager IP -->
      <address>192.168.1.100</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <config-profile>windows</config-profile>
  </client>

  <!-- 1. Sysmon Operational Log (Process Create, Network Connect, Registry, File Creation) -->
  <localfile>
    <location>Microsoft-Windows-Sysmon/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- 2. Windows Security Event Log (Logon 4624/4625, Privilege Use, Audit Policy) -->
  <localfile>
    <location>Security</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- 3. Windows System Log -->
  <localfile>
    <location>System</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- 4. Windows Application Log -->
  <localfile>
    <location>Application</location>
    <log_format>eventchannel</log_format>
  </localfile>
</ossec_config>

<ossec_config>
  <localfile>
    <log_format>apache</log_format>
    <location>/var/log/datasets/web_access.log</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/datasets/linux_auth.log</location>
  </localfile>

  <localfile>
    <log_format>json</log_format>
    <location>/var/log/datasets/windows_sysmon.json</location>
  </localfile>

  <integration>
    <name>slack</name>
    <hook_url>https://hooks.slack.com/services/CHANGE_ME</hook_url>
    <level>10</level>
    <alert_format>json</alert_format>
  </integration>

  <integration>
    <name>custom-webhook</name>
    <hook_url>https://webhook.site/CHANGE_ME</hook_url>
    <level>10</level>
    <alert_format>json</alert_format>
  </integration>
</ossec_config>
